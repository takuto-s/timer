<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卓管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="menu-wrapper">
        <button id="menu-btn">☰</button>
        <div id="menu-dropdown" class="hidden">
          <button id="reset-all-btn">全て空にする</button>
        </div>
      </div>
      <div id="floor-map"></div>
      <div id="lo-list">
        <div id="lo-header">
          <div id="current-time"></div>
        </div>
        <h2>LO時間</h2>
        <div id="lo-items"></div>
      </div>
    </div>

    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <h3 id="modal-title"></h3>
        <div class="modal-section">
          <label>フード:</label>
          <div class="modal-buttons">
            <button data-type="food" data-value="unlimited">食べ放題</button>
            <button data-type="food" data-value="single">単品</button>
          </div>
        </div>
        <div class="modal-section">
          <label>ドリンク:</label>
          <div class="modal-buttons">
            <button data-type="drink" data-value="unlimited">飲み放題</button>
            <button data-type="drink" data-value="single">単品</button>
          </div>
        </div>
        <div id="timer-section" class="modal-section">
          <label>タイマー:</label>
          <div class="modal-buttons timer-buttons">
            <button data-type="timer" data-value="70">70分</button>
            <button data-type="timer" data-value="75">75分</button>
            <button data-type="timer" data-value="90">90分</button>
          </div>
          <div class="custom-timer">
            <input
              type="number"
              id="custom-timer-input"
              placeholder="分"
              min="1"
              max="999"
            />
            <span>分</span>
          </div>
        </div>
        <button id="modal-confirm" disabled>決定</button>
        <button id="modal-cancel">キャンセル</button>
      </div>
    </div>

    <div id="edit-modal-overlay" class="hidden">
      <div id="edit-modal">
        <h3 id="edit-modal-title"></h3>
        <div class="modal-section">
          <label>状態:</label>
          <div
            class="modal-buttons edit-state-buttons"
            id="edit-state-buttons"
          ></div>
        </div>
        <div id="edit-eating-section" class="hidden">
          <div class="modal-section">
            <label>フード:</label>
            <div class="modal-buttons">
              <button data-type="edit-food" data-value="unlimited">
                食べ放題
              </button>
              <button data-type="edit-food" data-value="single">単品</button>
            </div>
          </div>
          <div class="modal-section">
            <label>ドリンク:</label>
            <div class="modal-buttons">
              <button data-type="edit-drink" data-value="unlimited">
                飲み放題
              </button>
              <button data-type="edit-drink" data-value="single">単品</button>
            </div>
          </div>
          <div id="edit-timer-section" class="modal-section">
            <label>タイマー:</label>
            <div class="modal-buttons timer-buttons">
              <button data-type="edit-timer" data-value="70">70分</button>
              <button data-type="edit-timer" data-value="75">75分</button>
              <button data-type="edit-timer" data-value="90">90分</button>
            </div>
            <div class="custom-timer">
              <input
                type="number"
                id="edit-custom-timer-input"
                placeholder="分"
                min="1"
                max="999"
              />
              <span>分</span>
            </div>
          </div>
        </div>
        <div class="modal-section">
          <label>備考:</label>
          <div class="toggle-buttons">
            <button id="edit-birthday-btn">🎂 誕生日</button>
            <button id="edit-allergy-btn">⚠ アレルギー</button>
          </div>
        </div>
        <button id="edit-modal-confirm" disabled>決定</button>
        <button id="edit-modal-cancel">キャンセル</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
